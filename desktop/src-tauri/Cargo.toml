[package]
name = "trambar"
version = "0.1.4"
edition = "2021"
rust-version = "1.89"
description = "Live VMS departures in the system tray"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde_json = "1"
tauri-plugin-http = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
